name: release-binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing git tag to build and publish, for example v0.1.4
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            artifact_suffix: macos-x64
          - runner: macos-14
            artifact_suffix: macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: node ./scripts/extract-release-notes.mjs "${{ github.event.inputs.release_tag || github.ref_name }}" /tmp/release-notes.txt

      - name: Test
        run: npm test

      - name: Build release artifacts
        run: npm run build:release

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: codex-authx-${{ matrix.artifact_suffix }}
          path: artifacts/release/codex-authx-${{ matrix.artifact_suffix }}.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built archives
        uses: actions/download-artifact@v8
        with:
          path: /tmp/release-artifacts

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes from changelog
        run: node ./scripts/extract-release-notes.mjs "${{ github.event.inputs.release_tag || github.ref_name }}" release-notes.txt

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.txt --draft=false
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.txt --verify-tag
          fi
          mapfile -t archives < <(find /tmp/release-artifacts -type f -name '*.tar.gz' | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release archives found under /tmp/release-artifacts" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" "${archives[@]}" --clobber
