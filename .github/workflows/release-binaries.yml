name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            artifact_suffix: macos-x64
          - runner: macos-14
            artifact_suffix: macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build release artifacts
        run: npm run build:release

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: codex-authx-${{ matrix.artifact_suffix }}
          path: artifacts/release/codex-authx-${{ matrix.artifact_suffix }}.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/codex-authx-macos-x64/codex-authx-macos-x64.tar.gz
            release-artifacts/codex-authx-macos-arm64/codex-authx-macos-arm64.tar.gz
